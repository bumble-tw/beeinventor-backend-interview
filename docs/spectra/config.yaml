schema: spec-driven

context: |
  BeeInventor DasIoT backend technical interview.
  Tech stack: TypeScript on Node.js 24 (runs .ts directly via type stripping, no build step).
  Runtime: standard library only; devDependencies limited to typescript + @types/node.
  Tests: Node built-in test runner (`node --test`), files in exercise-1-dictionary/test/*.test.ts.
  Exercise 1: in-memory dictionary (exact match, prefix search, wildcard `?` / `*`).
  Exercise 2: distributed document search platform system design (docs + diagrams only).
  Commits: conventional commits, one commit per exercise part so the solving process is reviewable.

